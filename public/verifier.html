<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Discord - Verify using BlindPass</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #1e1f22;
            color: #f2f3f5;
            padding: 1.5rem;
            line-height: 1.5;
        }

        .card {
            max-width: 460px;
            width: 100%;
            background: #2b2d31;
            border: 1px solid #3f4147;
            border-radius: 12px;
            padding: 2rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.4rem;
        }

        p {
            margin: 0;
            color: #b5bac1;
            font-size: 0.95rem;
        }

        .btn {
            display: inline-block;
            margin-top: 1.25rem;
            background: #5865f2;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 0.7rem 1.25rem;
            border-radius: 8px;
        }

            .btn:hover {
                background: #4752c4;
            }

        .status {
            margin-top: 1.25rem;
            padding: 0.9rem;
            border-radius: 8px;
            background: #1e1f22;
            border: 1px solid #3f4147;
            font-family: ui-monospace, SFMono-Regular, monospace;
            font-size: 0.88rem;
            color: #dbdee1;
        }

        .ok {
            color: #23a55a;
            font-weight: 700;
        }

        .no {
            color: #f23f43;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Discord Server Age Verification</h1>
        <p>Prove you are 18+ using BlindPass. Scan the QR code with your phone to verify without sharing your ID image.</p>

        <a class="btn" href="/start?verifier=Discord&return_to=%2Fverifier.html">
            Verify using BlindPass
        </a>

        <div id="status" class="status">Status: Waiting for verification...</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const statusEl = document.getElementById('status');

        if (params.get('verified') === '1') {
            const isOver18 = params.get('is_over_18') === 'true';
            statusEl.innerHTML = isOver18
                ? 'Status: <span class="ok">Verified (18+: true)</span>'
                : 'Status: <span class="no">Not 18+ (18+: false)</span>';
        }
    </script>
</body>
</html>
